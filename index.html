<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const SUPABASE_FUNCTION_URL="https://mtcwhbemwlnmfophlxfm.supabase.co/functions/v1/bright-processor";

const tg=window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

const state=JSON.parse(
  localStorage.getItem("turboRace") ||
  '{"coins":100,"mult":1}'
);

let telegramPlayer=null;
let mode="1v1";
let running=false;
let pos=50;
let timer;
let score=0;

const $=id=>document.getElementById(id);


/* =========================
   اتصال بالخادم
========================= */

async function server(action, extra={}){
  if(!tg || !tg.initData){
    throw new Error("Telegram initData missing");
  }

  const res=await fetch(SUPABASE_FUNCTION_URL,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      action,
      initData:tg.initData,
      ...extra
    })
  });

  const data=await res.json();

  if(!res.ok || !data.ok){
    throw new Error(data.error || "Server error");
  }

  return data;
}


/* =========================
   تسجيل الدخول
========================= */

async function connectTelegram(){

  if(!tg || !tg.initData){
    $("status").textContent=
      "ℹ️ افتح اللعبة من بوت Telegram لتسجيل الدخول";
    return;
  }

  try{

    $("status").textContent=
      "🔄 جارٍ تسجيل الدخول...";

    const data=await server("login");

    telegramPlayer=data.player;

    state.coins=Number(data.player.coins);
    state.mult=Number(data.player.multiplier);

    localStorage.setItem(
      "turboRace",
      JSON.stringify(state)
    );

    render();

    $("status").textContent=
      `👋 أهلاً ${data.player.first_name||"بالسائق"}`;

  }catch(err){

    console.error(err);

    $("status").textContent=
      "❌ تعذر الاتصال بالخادم";
  }
}


/* =========================
   حفظ محلي للعرض فقط
========================= */

function save(){
  localStorage.setItem(
    "turboRace",
    JSON.stringify(state)
  );

  render();
}


/* =========================
   عرض العملات
========================= */

function render(){

  $("coins").textContent=
    Math.floor(state.coins);

  $("mult").textContent=
    Number(state.mult).toFixed(2);
}


/* =========================
   اختيار نمط السباق
========================= */

function setMode(m){

  mode=m;

  document
    .querySelectorAll(".mode")
    .forEach(x=>x.classList.remove("active"));

  (m==="1v1"?$("one"):$("traffic"))
    .classList.add("active");

  document
    .querySelectorAll(".enemy")
    .forEach((e,i)=>
      e.style.display=
        (m==="1v1"&&i>0)?"none":"grid"
    );

  $("status").textContent=
    m==="1v1"
      ?"منافس واحد — اضغط ابدأ"
      :"تجاوز السيارات دون الاصطدام";
}

$("one").onclick=()=>setMode("1v1");
$("traffic").onclick=()=>setMode("traffic");


/* =========================
   حركة السيارة
========================= */

function move(d){

  pos=Math.max(
    8,
    Math.min(92,pos+d)
  );

  $("player").style.left=
    pos+"%";
}

$("left").onclick=()=>move(-8);
$("right").onclick=()=>move(8);

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      move(-8);

    if(e.key==="ArrowRight")
      move(8);

    if(e.code==="Space")
      start();
  }
);


/* =========================
   بداية السباق
========================= */

async function start(){

  if(running) return;

  try{

    $("status").textContent=
      "🔄 تجهيز السباق...";

    /*
      نسجل بداية السباق في Supabase
      قبل تشغيل السباق محليًا.
    */
    await server("start_race");

    running=true;
    score=0;

    $("status").textContent=
      "🚦 انطلق!";

    let enemies=[
      ...document.querySelectorAll(".enemy")
    ];

    let ys=[
      -20,
      -130,
      -240
    ];

    let lanes=[
      20,
      55,
      78
    ];

    if(mode==="1v1"){

      ys[0]=-80;
      lanes[0]=50;

      enemies.forEach((e,i)=>{

        if(i===0){

          e.style.display="grid";
          e.style.left="50%";

        }else{

          e.style.display="none";
        }

      });

    }else{

      enemies.forEach((e,i)=>{

        e.style.display="grid";
        e.style.left=
          lanes[i]+"%";
      });
    }

    let last=performance.now();

    function loop(now){

      if(!running) return;

      let dt=
        Math.min(40,now-last);

      last=now;

      enemies.forEach((e,i)=>{

        if(e.style.display==="none")
          return;

        ys[i]+=
          dt*
          (
            0.11+
            (mode==="traffic"
              ?0.035*i
              :0)
          );

        if(ys[i]>410){

          ys[i]=
            -70-
            Math.random()*120;

          if(mode==="traffic"){

            e.style.left=
              (10+Math.random()*80)+"%";
          }

          score++;
        }

        e.style.top=
          ys[i]+"px";

        const er=
          e.getBoundingClientRect();

        const pr=
          $("player")
          .getBoundingClientRect();

        if(
          !(
            er.right<pr.left+8 ||
            er.left>pr.right-8 ||
            er.bottom<pr.top+8 ||
            er.top>pr.bottom-8
          )
        ){

          finish(false);
          return;
        }
      });

      if(
        score >=
        (mode==="1v1"?3:8)
      ){

        finish(true);
        return;
      }

      timer=
        requestAnimationFrame(loop);
    }

    timer=
      requestAnimationFrame(loop);

  }catch(err){

    console.error(err);

    running=false;

    $("status").textContent=
      "❌ تعذر بدء السباق";
  }
}


/* =========================
   نهاية السباق
========================= */

async function finish(win){

  if(!running) return;

  running=false;

  cancelAnimationFrame(timer);

  try{

    $("status").textContent=
      win
        ?"🏆 جاري تسجيل الفوز..."
        :"💥 جاري تسجيل النتيجة...";

    /*
      الخادم هو الذي يحسب المكافأة
      ويزيد العملات.
    */
    const data=
      await server(
        "finish_race",
        {
          won:Boolean(win)
        }
      );

    telegramPlayer=
      data.player;

    state.coins=
      Number(data.player.coins);

    state.mult=
      Number(data.player.multiplier);

    save();

    if(win){

      $("status").textContent=
        `🏆 فوز! +${data.reward} 🪙`;

    }else{

      $("status").textContent=
        `💥 اصطدمت! +${data.reward} 🪙`;
    }

  }catch(err){

    console.error(err);

    $("status").textContent=
      "❌ تعذر حفظ نتيجة السباق";

    /*
      لا نضيف العملات محليًا
      إذا فشل الخادم.
    */
  }
}


/* =========================
   أزرار البداية
========================= */

$("start").onclick=start;
$("go").onclick=start;


/* =========================
   الترقيات
========================= */

document
  .querySelectorAll(".upgrade")
  .forEach((b,index)=>{

    b.onclick=async()=>{

      try{

        /*
          نحدد نوع الترقية من النص.
        */
        const text=
          b.textContent;

        let type=null;

        if(text.includes("الإطارات"))
          type="tires_level";

        else if(text.includes("الفرامل"))
          type="brakes_level";

        else if(text.includes("المحرك"))
          type="engine_level";

        else if(text.includes("التيربو"))
          type="turbo_level";

        else if(text.includes("السيارة"))
          type="car_level";

        if(!type){

          $("status").textContent=
            "❌ نوع الترقية غير معروف";

          return;
        }

        $("status").textContent=
          "🔄 جاري شراء الترقية...";

        const data=
          await server(
            "upgrade",
            {type}
          );

        telegramPlayer=
          data.player;

        state.coins=
          Number(data.player.coins);

        state.mult=
          Number(data.player.multiplier);

        save();

        $("status").textContent=
          `✅ تمت الترقية -${data.cost} 🪙`;

      }catch(err){

        console.error(err);

        if(
          err.message===
          "Not enough coins"
        ){

          $("status").textContent=
            "❌ العملات غير كافية";

        }else{

          $("status").textContent=
            "❌ تعذر تنفيذ الترقية";
        }
      }
    };
  });


/* =========================
   تشغيل اللعبة
========================= */

setMode("1v1");

render();

connectTelegram();

</script>
</body>
</html>
