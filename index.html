<title>Turbo Race</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.app{max-width:520px;margin:auto;min-height:100vh;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:23px;font-weight:900}.stats{display:flex;gap:7px}.pill{background:#12233a;border:1px solid #263d5b;border-radius:14px;padding:7px 10px;font-size:13px}
.card{background:#0e1b2d;border:1px solid #1e3551;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 25px #0004}
.track{height:390px;border-radius:16px;position:relative;overflow:hidden;background:#30343a;border:3px solid #20262c}
.road{position:absolute;inset:0;background:linear-gradient(90deg,#292d33 0 3%,#454a50 3% 31.5%,#292d33 31.5% 34%,#454a50 34% 65.5%,#292d33 65.5% 68%,#454a50 68% 97%,#292d33 97% 100%)}
.road:before,.road:after{content:"";position:absolute;top:-20px;width:5px;height:450px;background:repeating-linear-gradient(#fff0 0 24px,#f7f7f7 24px 52px,#fff0 52px 82px);opacity:.72}
.road:before{left:33.333%;transform:translateX(-50%)}.road:after{left:66.666%;transform:translateX(-50%)}

.car{position:absolute;width:54px;height:82px;display:block;z-index:3;transition:left .12s ease}
.car-body{position:absolute;inset:5px 7px;border-radius:15px 15px 11px 11px;background:linear-gradient(135deg,#f5f5f5,#9aa3ad);border:2px solid #dce3e9;box-shadow:inset 0 0 8px #fff8,0 5px 9px #0009}
.car-body:before{content:"";position:absolute;left:9px;right:9px;top:13px;height:23px;border-radius:8px;background:linear-gradient(#172331,#7890a7 55%,#253646);border:1px solid #aab8c5}
.car-body:after{content:"";position:absolute;left:5px;right:5px;bottom:7px;height:8px;border-radius:5px;background:linear-gradient(90deg,#ff3b30 0 23%,#222 23% 77%,#ff3b30 77%);box-shadow:0 0 7px #f33}
