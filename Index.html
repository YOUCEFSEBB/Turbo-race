<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Race</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#08111f;color:#fff;font-family:Arial,sans-serif}
body{min-height:100vh}
.app{width:100%;max-width:520px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:23px;font-weight:900}
.stats{display:flex;gap:7px}
.pill{background:#12233a;border:1px solid #263d5b;border-radius:14px;padding:7px 10px;font-size:13px}
.card{background:#0e1b2d;border:1px solid #1e3551;border-radius:18px;padding:14px;margin-bottom:12px}
h3{margin:5px 0 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font-family:inherit;cursor:pointer}
.mode,.upgrade{border:0;border-radius:14px;padding:13px;color:#fff;background:#173858;font-weight:bold}
.mode.active{background:#1f7a55}
.track{height:390px;border-radius:16px;position:relative;overflow:hidden;background:#383d43;border:3px solid #20262c}
.road{position:absolute;inset:0;background:linear-gradient(90deg,#292d33 0 32%,#4a4f55 32% 34%,#292d33 34% 66%,#4a4f55 66% 68%,#292d33 68% 100%)}
.lane-line{position:absolute;top:0;width:4px;height:100%;background:repeating-linear-gradient(to bottom,transparent 0 28px,#fff 28px 52px,transparent 52px 82px);opacity:.7}
.line1{left:33.333%}.line2{left:66.666%}
.car{position:absolute;width:54px;height:82px;z-index:5;transition:left .12s ease}
.player{bottom:18px;left:50%;transform:translateX(-50%)}
.enemy{top:-100px}
.car-body{position:absolute;left:7px;right:7px;top:4px;bottom:4px;border-radius:15px 15px 11px 11px;border:2px solid #dfe7ed;box-shadow:0 5px 10px #0009}
.player .car-body{background:linear-gradient(135deg,#fff08a,#ffb000 48%,#b56500)}
.enemy .car-body{background:linear-gradient(135deg,#ff6666,#b51428 55%,#5d0914)}
.taxi .car-body{background:linear-gradient(135deg,#ffe36b,#d28a00 55%,#765000)}
.car-body:before{content:"";position:absolute;left:9px;right:9px;top:12px;height:24px;border-radius:8px;background:linear-gradient(#172331,#7890a7 55%,#253646);border:1px solid #aab8c5}
.car-body:after{content:"";position:absolute;left:5px;right:5px;bottom:7px;height:8px;border-radius:5px;background:linear-gradient(90deg,#ff3b30 0 24%,#222 24% 76%,#ff3b30 76%);box-shadow:0 0 7px #f33}
.wheel{position:absolute;top:31px;width:9px;height:21px;border-radius:5px;background:#111;z-index:6}
.w1{left:1px}.w2{right:1px}
.controls{display:flex;gap:10px;margin-top:10px}
.control{flex:1;padding:14px;border:0;border-radius:14px;background:#162d48;color:#fff;font-size:23px;font-weight:bold}
.status{text-align:center;color:#b9c9db;min-height:24px;margin:8px 0}
.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#ffb000;color:#151515;font-size:17px;font-weight:900}
.upgrades{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.upgrade small{display:block;opacity:.7;margin-top:5px}
.ad{height:64px;display:grid;place-items:center;border:1px dashed #55708f;border-radius:13px;color:#9fb2c8;font-size:13px;background:#0a1625}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">🏁 Turbo Race</div>
<div class="stats">
<div class="pill">🪙 <span id="coins">100</span></div>
<div class="pill">⚡ <span id="mult">1.00</span>x</div>
</div>
</header>

<div class="card">
<h3>اختر نمط السباق</h3>
<div class="modes">
<button type="button" class="mode active" id="one">🏎️ 1 ضد 1</button>
<button type="button" class="mode" id="traffic">🚗 تجاوز السيارات</button>
</div>
</div>

<div class="card">
<div class="track" id="track">
<div class="road"></div>
<div class="lane-line line1"></div>
<div class="lane-line line2"></div>

<div class="car enemy e1" id="enemy1"><div class="car-body"></div><span class="wheel w1"></span><span class="wheel w2"></span></div>
<div class="car enemy taxi e2" id="enemy2"><div class="car-body"></div><span class="wheel w1"></span><span class="wheel w2"></span></div>
<div class="car enemy e3" id="enemy3"><div class="car-body"></div><span class="wheel w1"></span><span class="wheel w2"></span></div>

<div class="car player" id="player"><div class="car-body"></div><span class="wheel w1"></span><span class="wheel w2"></span></div>
</div>

<div class="controls">
<button type="button" class="control" id="left">◀</button>
<button type="button" class="control" id="go">🏁</button>
<button type="button" class="control" id="right">▶</button>
</div>

<div class="status" id="status">جاهز للسباق</div>
<button type="button" class="primary" id="start">ابدأ السباق</button>
</div>

<div class="card">
<h3>🔧 تطوير السيارة</h3>
<div class="upgrades">
<button type="button" class="upgrade" data-cost="50" data-add="0.10">🔧 المحرك<small>50 🪙 • +0.10x</small></button>
<button type="button" class="upgrade" data-cost="75" data-add="0.10">⚡ التيربو<small>75 🪙 • +0.10x</small></button>
<button type="button" class="upgrade" data-cost="60" data-add="0.05">🛞 الإطارات<small>60 🪙 • +0.05x</small></button>
<button type="button" class="upgrade" data-cost="80" data-add="0.05">🛑 الفرامل<small>80 🪙 • +0.05x</small></button>
</div>
</div>

<div class="card"><div class="ad">📺 مكان إعلان Mini App — سنربطه لاحقًا بمزود الإعلانات</div></div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function(){
"use strict";

var SUPABASE_FUNCTION_URL="https://mtcwhbemwlnmfophlxfm.supabase.co/functions/v1/bright-processor";
var tg=(window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var state={coins:100,mult:1};
var mode="1v1", running=false, lane=1, score=0, animationId=0;
var laneLeft=["16.666%","50%","83.333%"];

try{
  var saved=localStorage.getItem("turboRace");
  if(saved) state=JSON.parse(saved);
}catch(e){}
if(typeof state.coins!=="number") state.coins=100;
if(typeof state.mult!=="number") state.mult=1;

function $(id){return document.getElementById(id);}
function status(t){var el=$("status"); if(el) el.textContent=t;}
function render(){
  var c=$("coins"), m=$("mult");
  if(c)c.textContent=Math.floor(state.coins);
  if(m)m.textContent=Number(state.mult).toFixed(2);
}
function save(){
  try{localStorage.setItem("turboRace",JSON.stringify(state));}catch(e){}
  render();
}

function resetCars(){
  lane=1;
  var p=$("player");
  if(p)p.style.left=laneLeft[lane];
  var cars=[$("enemy1"),$("enemy2"),$("enemy3")];
  var starts=[-100,-285,-470], lanes=[0,2,1];
  for(var i=0;i<cars.length;i++){
    if(!cars[i])continue;
    cars[i].style.top=starts[i]+"px";
    cars[i].style.left=laneLeft[lanes[i]];
  }
}

function setMode(m){
  mode=m;
  var one=$("one"), traffic=$("traffic");
  if(one)one.classList.toggle("active",m==="1v1");
  if(traffic)traffic.classList.toggle("active",m==="traffic");
  var cars=[$("enemy1"),$("enemy2"),$("enemy3")];
  for(var i=0;i<cars.length;i++){
    if(cars[i])cars[i].style.display=(m==="1v1" && i>0)?"none":"block";
  }
  resetCars();
  status(m==="1v1"?"منافس واحد — اضغط ابدأ":"تجاوز السيارات من اليمين أو اليسار");
}

function move(dir){
  if(!running)return;
  lane=Math.max(0,Math.min(2,lane+dir));
  var p=$("player");
  if(p)p.style.left=laneLeft[lane];
}

function finish(win){
  running=false;
  if(animationId)cancelAnimationFrame(animationId);
  if(win){
    var reward=Math.round((mode==="1v1"?25:40)*Number(state.mult));
    state.coins+=reward;
    status("🏆 فوز! +"+reward+" 🪙");
  }else{
    status("💥 اصطدمت! حاول مرة أخرى");
  }
  save();
}

function chooseLane(index, carLane, y, cars){
  var choices=[0,1,2].filter(function(x){return x!==lane;});
  var nearest=-1, distance=99999;
  for(var k=0;k<cars.length;k++){
    if(k===index || !cars[k] || cars[k].style.display==="none")continue;
    var d=Math.abs(y[k]-y[index]);
    if(d<distance){distance=d;nearest=carLane[k];}
  }
  if(nearest>=0 && distance<230){
    var f=choices.filter(function(x){return x!==nearest;});
    if(f.length)choices=f;
  }
  return choices[Math.floor(Math.random()*choices.length)];
}

function start(){
  if(running)return;
  running=true;
  score=0;
  status("🚦 انطلق!");

  var cars=[$("enemy1"),$("enemy2"),$("enemy3")];
  var y=[-100,-285,-470];
  var carLane=[0,2,1];
  var last=performance.now();
  var trafficSpeed=0.19;

  for(var i=0;i<cars.length;i++){
    if(!cars[i])continue;
    cars[i].style.display=(mode==="1v1" && i>0)?"none":"block";
    y[i]=-100-(i*185);
    carLane[i]=(mode==="1v1")?1:[0,2,1][i];
    cars[i].style.left=laneLeft[carLane[i]];
  }

  function loop(now){
    if(!running)return;
    var dt=Math.min(40,now-last);
    last=now;

    for(var i=0;i<cars.length;i++){
      if(!cars[i] || cars[i].style.display==="none")continue;

      var speed=(mode==="traffic")?(trafficSpeed+i*0.012):0.14;
      y[i]+=dt*speed;

      if(y[i]>410){
        score++;
        if(mode==="traffic"){
          var highest=-9999;
          for(var k=0;k<cars.length;k++){
            if(k!==i && cars[k] && cars[k].style.display!=="none"){
              highest=Math.max(highest,y[k]);
            }
          }
          y[i]=highest-185-Math.random()*45;
          carLane[i]=chooseLane(i,carLane,y,cars);
        }else{
          y[i]=-100-Math.random()*80;
          carLane[i]=1;
        }
        cars[i].style.left=laneLeft[carLane[i]];
      }

      cars[i].style.top=y[i]+"px";

      var er=cars[i].getBoundingClientRect();
      var p=$("player");
      if(p){
        var pr=p.getBoundingClientRect();
        var hitX=er.left<pr.right-10 && er.right>pr.left+10;
        var hitY=er.top<pr.bottom-10 && er.bottom>pr.top+10;
        if(hitX && hitY){finish(false);return;}
      }
    }

    if(score>=(mode==="1v1"?3:8)){finish(true);return;}
    animationId=requestAnimationFrame(loop);
  }

  animationId=requestAnimationFrame(loop);
}

/* Event delegation: الأزرار تعمل حتى لو تغير ترتيب العناصر */
document.addEventListener("click",function(e){
  var el=e.target;
  while(el && el!==document && el.tagName!=="BUTTON")el=el.parentElement;
  if(!el || el.tagName!=="BUTTON")return;

  var id=el.id;
  if(id==="one"){setMode("1v1");return;}
  if(id==="traffic"){setMode("traffic");return;}
  if(id==="left"){move(-1);return;}
  if(id==="right"){move(1);return;}
  if(id==="go" || id==="start"){start();return;}

  if(el.classList.contains("upgrade")){
    var cost=Number(el.getAttribute("data-cost"));
    var add=Number(el.getAttribute("data-add"));
    if(state.coins<cost){status("❌ العملات غير كافية");return;}
    state.coins-=cost;
    state.mult+=add;
    status("✅ تمت الترقية");
    save();
  }
});

document.addEventListener("keydown",function(e){
  if(e.key==="ArrowLeft")move(-1);
  if(e.key==="ArrowRight")move(1);
  if(e.code==="Space")start();
});

function connectTelegram(){
  if(!tg || !tg.initData){status("جاهز للسباق");return;}
  try{tg.ready();tg.expand();}catch(e){}
  status("🔄 جارٍ تسجيل الدخول...");
  fetch(SUPABASE_FUNCTION_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({initData:tg.initData})
  })
  .then(function(r){return r.json().then(function(d){return {ok:r.ok,data:d};});})
  .then(function(x){
    if(!x.ok || !x.data.ok)throw new Error("login");
    var p=x.data.player||{};
    state.coins=Number(p.coins);
    state.mult=Number(p.multiplier);
    save();
    status("👋 أهلاً "+(p.first_name||"بالسائق"));
  })
  .catch(function(){status("جاهز للسباق");});
}

setMode("1v1");
render();
connectTelegram();

})();
</script>
</body>
</html>
